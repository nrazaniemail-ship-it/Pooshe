name: Pooshe Personal Unlocked APK

on:
  workflow_dispatch:
  push:
    branches:
      - personal-unlocked

permissions:
  contents: read

concurrency:
  group: pooshe-personal-unlocked-apk
  cancel-in-progress: false

jobs:
  build-personal-apk:
    name: Build signed personal APK (all current features)
    if: github.ref == 'refs/heads/personal-unlocked'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout personal-unlocked branch only
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and verify image tooling required by Android configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user Pillow
          python3 -c "from PIL import Image; print('Pillow ready:', Image.__version__)"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses and install SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          for f in package.json index.html capacitor.config.ts src/main.js \
            scripts/configure-android-backup.mjs native/android/BackupFolderPlugin.java.tpl resources/icon.png
          do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run project tests
        run: npm test

      - name: Build web app and generate Android project
        run: npm run android:add

      - name: Configure Android project
        run: npm run android:configure

      - name: Build web app and sync Capacitor
        run: npm run android:sync

      - name: Build unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      # Pooshe currently has no subscription/trial entitlement gate in src/main.js.
      # Therefore this personal build retains all features already present in the app;
      # there is no Pro-access function to override as in Namello.

      - name: Restore existing Pooshe signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/pooshe-signing"
          chmod 700 "$RUNNER_TEMP/pooshe-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pooshe-signing/pooshe-release.p12"
          chmod 600 "$RUNNER_TEMP/pooshe-signing/pooshe-release.p12"
          test -s "$RUNNER_TEMP/pooshe-signing/pooshe-release.p12"

      - name: Sign and verify personal APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/Pooshe-${VERSION}-personal-unlocked.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEYSTORE="$RUNNER_TEMP/pooshe-signing/pooshe-release.p12"
          test -f "$UNSIGNED_APK"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD \
            --key-pass env:STORE_PASSWORD --out "$SIGNED_APK" "$UNSIGNED_APK"
          "$APK_SIGNER" verify --verbose --print-certs "$SIGNED_APK"
          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload personal unlocked APK
        uses: actions/upload-artifact@v4
        with:
          name: Pooshe-${{ env.APP_VERSION }}-Personal-Unlocked-APK
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pooshe-personal-unlocked-build-reports
          path: |
            android/app/build/reports
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/java
          if-no-files-found: ignore
          retention-days: 7
