name: Verify Bazaar subscription integration
on:
  push:
    branches: [subscription-bazaar]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pooshe-subscription-check
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subscription-bazaar
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Run test suite
        run: npm test
      - name: Build web app
        env:
          VITE_BAZAAR_RSA_PUBLIC_KEY: ${{ vars.VITE_BAZAAR_RSA_PUBLIC_KEY }}
        run: npm run build
      - name: Generate Android project
        run: npm run android:add
      - name: Configure Android and Poolakey
        run: npm run android:configure
      - name: Sync Capacitor
        env:
          VITE_BAZAAR_RSA_PUBLIC_KEY: ${{ vars.VITE_BAZAAR_RSA_PUBLIC_KEY }}
        run: npm run android:sync
      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pooshe-Bazaar-Integration-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
